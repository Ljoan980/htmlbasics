<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <div class="container">
        <div class="logo">Pixel</div>
        <h1>Create Account</h1>
        <p class="subtittle">Please fill in your details for account  creation</p>
    <form action="">
        <div class="input-group">
            <label for="fullname">Fullname</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your fullname" required>
        </div>
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
        </div>
        <div class="input-group">
            <label for="password">Confirm-password</label>
            <input type="password" id="Confirm-password" name="Confirm-password" placeholder="Enter your password">
        </div>   
    <div class="terms">
        <label for="terms">I agree to the terms</label>
        </div> 
    <button type="Submit">Create Account</button>
</form> 
<p>Already have an account?
    <a href="#">Login here</a></p>  
 </div>
 <link rel="stylesheet" href="static/css/styles.css">
 
    
</body>
</html>
