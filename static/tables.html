<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title
<head>
<body>
    <h1>Tables in HTML</h1>
    <p>Used to display data in a tabular format.
        They consist of rows and columns, and can be styled using CSS. 
    </P>

    <table>
        <tr>
            <th>Country</th>
            <th>Capital</th>
            <th>Population</th>
             
        </tr>
        <tr>
            <td>Kenya</td>
            <td>Nairobi</td>
            <td>50 million</td>
        </tr>
        <td>Uganda</td>
        <td>Kampala</td>
        <td>70 million</td>
        <tr>
           <td>Tanzania</td>
           <td>Dodoma</td>
           <td>80 million</td>
        </tr>

    </table>
    <link rel="stylesheet" href="CSS/styles.css">
    
</body>
</html>
